[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrolink-core"
version = "1.1.1"
description = "SpectroLink 共用物理内核：HITRAN 线表/吸收谱、Voigt、锁相谐波、噪声统计、免标定反演"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "hitran-api"]

[tool.setuptools]
packages = ["spectrolink_core"]

[tool.setuptools.package-dir]
spectrolink_core = "."
